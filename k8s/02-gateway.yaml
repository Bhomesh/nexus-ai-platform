apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-gateway
  namespace: nexus-system
  labels:
    app: nexus-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-gateway
  template:
    metadata:
      labels:
        app: nexus-gateway
    spec:
      containers:
      - name: gateway
        image: nexus-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: ENGINE_URL
          value: "http://nexus-engine:8085"
        - name: FRONTEND_DIR
          value: "/app/frontend-web"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/telemetry
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /api/telemetry
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-gateway
  namespace: nexus-system
  labels:
    app: nexus-gateway
spec:
  type: NodePort
  selector:
    app: nexus-gateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
