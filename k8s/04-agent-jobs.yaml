apiVersion: batch/v1
kind: Job
metadata:
  name: agent-devops-preflight
  namespace: nexus-system
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        role: devops-engineer
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: nexus-agent-worker:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: AGENT_ROLE
          value: "devops_engineer"
        - name: AGENT_TASK
          value: "Verify Kubernetes cluster DNS, TCP socket RTT, health probes"
        - name: TARGET_GATEWAY_URL
          value: "http://nexus-gateway:8080"
        - name: TARGET_ENGINE_URL
          value: "http://nexus-engine:8085"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
