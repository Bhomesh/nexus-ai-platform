apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: nexus-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.nexus-monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: nexus-monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'nexus-dashboards'
        orgId: 1
        folder: 'Nexus AI Telemetry'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-dashboard-json
  namespace: nexus-monitoring
data:
  nexus-telemetry.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "title": "Platform Status & Autoscaling Overview",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 2}, {"color": "red", "value": 4}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 1},
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "pluginVersion": "10.3.3",
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "editorMode": "code",
              "expr": "count(nexus_gateway_engine_status)",
              "legendFormat": "Gateway Replicas",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Active Gateway Replicas (HPA)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [
                {"options": {"0": {"color": "red", "text": "DISCONNECTED"}, "1": {"color": "green", "text": "ONLINE (Port 8085)"}}, "type": "value"}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 1},
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "pluginVersion": "10.3.3",
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "editorMode": "code",
              "expr": "max(nexus_gateway_engine_status)",
              "legendFormat": "Engine Link",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Rust Native Engine Status",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "blue", "value": null}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 1},
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "pluginVersion": "10.3.3",
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "editorMode": "code",
              "expr": "sum(nexus_gateway_requests_total)",
              "legendFormat": "Total Requests",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Total Processed Requests",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "purple", "value": null}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 1},
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "pluginVersion": "10.3.3",
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "editorMode": "code",
              "expr": "max(nexus_gateway_worker_threads)",
              "legendFormat": "Hardware Threads",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Configured Worker Threads",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 5},
          "id": 6,
          "title": "Traffic Throughput & Runtime Telemetry",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "req/sec",
                "axisPlacement": "auto",
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "lineWidth": 2
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "id": 7,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "single"}},
          "pluginVersion": "10.3.3",
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "editorMode": "code",
              "expr": "sum(rate(nexus_gateway_requests_total[15s]))",
              "legendFormat": "Throughput (RPS)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Request Rate (Throughput)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "Goroutines",
                "axisPlacement": "auto",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineWidth": 2
              },
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "yellow", "value": null}]}
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "id": 8,
          "options": {"legend": {"calcs": [], "displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "single"}},
          "pluginVersion": "10.3.3",
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "Prometheus"},
              "editorMode": "code",
              "expr": "nexus_gateway_active_goroutines",
              "legendFormat": "Pod {{instance}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Active Goroutines per Gateway Replica",
          "type": "timeseries"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["nexus", "ai", "telemetry", "k8s"],
      "templating": {"list": []},
      "time": {"from": "now-15m", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Nexus AI Platform & Autoscaling Telemetry",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: nexus-monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.3.3
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 3000
            name: http
        env:
          - name: GF_SECURITY_ADMIN_USER
            value: "admin"
          - name: GF_SECURITY_ADMIN_PASSWORD
            value: "admin"
          - name: GF_AUTH_ANONYMOUS_ENABLED
            value: "true"
          - name: GF_AUTH_ANONYMOUS_ORG_ROLE
            value: "Admin"
          - name: GF_AUTH_DISABLE_LOGIN_FORM
            value: "false"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
          - name: datasource-config
            mountPath: /etc/grafana/provisioning/datasources
          - name: dashboard-provider
            mountPath: /etc/grafana/provisioning/dashboards
          - name: dashboard-json
            mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource-config
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-json
          configMap:
            name: nexus-dashboard-json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: nexus-monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
      name: http
